apply plugin: 'org.jetbrains.dokka'

// Rewrites Dokka GFM's local links (for example `-camera-mode/index.md`) to
// `${apiReferenceBasePath}/camera-core/.../-camera-mode/index.md` so Markdown
// remains navigable after the module outputs are merged into `dokka/custom`.
boolean useAbsoluteGfmLinks = true

// Chrome blocks many of the functionality if you open index.html from the file system.
// Instead open the file from AS directly. It creates a local server before opening the file.
// Port 63342 is the default port that Jetbrains uses.
String apiReferenceBasePath
if (System.getenv("DOCS_BASE_URL") != null) {
    apiReferenceBasePath = System.getenv("DOCS_BASE_URL") + "/android/api-reference"
} else {
    def projectName = rootProject.name.replace(" ", "%20")
    apiReferenceBasePath = "http://localhost:63342/$projectName/build/dokka/custom"
}

static Set<Project> transitiveProjectDependencies(Project start) {
    Set<Project> visited = [] as Set<Project>
    Set<String> visitedPaths = [] as Set<String>
    def visit
    visit = { Project project ->
        if (!visited.add(project)) return
        project.configurations.configureEach { configuration ->
            configuration.dependencies.withType(ProjectDependency).configureEach { dep ->
                if (visitedPaths.add(dep.path)) {
                    def depProject = project.rootProject.findProject(dep.path)
                    if (depProject != null) {
                        visit(depProject)
                    }
                }
            }
        }
    }
    visit(start)
    visited.remove(start)
    return visited
}

void configureDokkaFiles(File docsDir) {
    // Copy `dokka-assets/logo-link.js` file to the file hierarchy of docs to reference in index.html.
    copy {
        from("${rootProject.projectDir}/sources/dokka-assets/logo-link.js")
        into(new File(docsDir, "scripts"))
    }
    // Override `dokka-assets/logo-icon.svg` file to change the logo.
    copy {
        from("${rootProject.projectDir}/sources/dokka-assets/logo-icon.svg")
        into(new File(docsDir, "images"))
    }
    // Override favicon used by the docs.
    copy {
        from("${rootProject.projectDir}/sources/dokka-assets/favicon.ico")
        into(new File(docsDir, "images"))
    }
    // Inject loader that resolves via Dokka's `pathToRoot` so nested pages work.
    def scriptTag = '<script>(function(){var r=(typeof pathToRoot==="string")?pathToRoot:"";var s=document.createElement("script");s.src=r+"scripts/logo-link.js";document.body.appendChild(s);}())</script>'

    // Dokka emits purely relative asset URLs (`href="../../styles/style.css"`)
    // and assumes the page is served from a directory URL with a trailing
    // slash. The Vercel-hosted live deploy at https://img.ly/docs/cesdk strips
    // trailing slashes from directory URLs (e.g. `/.../ly.img.engine/` 308s to
    // `/.../ly.img.engine`), which shifts the browser's URL resolution base up
    // one level and breaks every relative `<link>` and `<script>`.
    //
    // To compensate, inject a tiny inline script as the very first child of
    // `<head>`. When (and only when) the document URL has no trailing slash
    // and isn't a direct `.html` hit, the script `document.write`s a `<base>`
    // tag pointing at the current path's last segment with a trailing slash
    // appended. Because `document.write` runs synchronously during head
    // parsing, the resulting `<base>` is in scope for every subsequent
    // `<link>` and `<script>` element. On hosts that keep the trailing slash
    // (the develop and archive deploys, local file:// access) the script is a
    // noop and behavior is unchanged.
    def baseFixTag = '<script>(function(){var p=location.pathname;if(!p.endsWith("/")&&!p.endsWith(".html")){document.write(\'<base href="\'+p.substring(p.lastIndexOf("/")+1)+\'/">\');}})();</script>'

    // Block Google indexing (thin-content risk) but keep crawling open for LLMs.
    def noindexTag = '<meta name="robots" content="noindex">'

    docsDir.eachFileRecurse { file ->
        if (!file.isFile()) return
        if (!file.name.endsWith(".html")) return

        def html = file.getText("UTF-8")
        def patched = html

        if (!patched.contains(baseFixTag) && patched.contains("<head>")) {
            patched = patched.replace("<head>", "<head>${baseFixTag}")
        }

        if (!patched.contains(noindexTag) && patched.contains("<head>")) {
            patched = patched.replace("<head>", "<head>${noindexTag}")
        }

        if (!patched.contains(scriptTag) && patched.contains("</body>")) {
            patched = patched.replace("</body>", "${scriptTag}</body>")
        }

        if (patched != html) {
            file.write(patched, "UTF-8")
        }
    }
}

def configureDokkaTask = { String taskName, String customFormat, boolean configureHtmlFiles ->
    tasks.named(taskName) {
        moduleName.set("ly.img:${project.name}")

        def dependencies = transitiveProjectDependencies(project)
            .findAll { it.plugins.hasPlugin("org.jetbrains.dokka") }
        def dependencyTasks = dependencies
            .collect { it.tasks.named("${taskName}Custom") }
        def docsLocalDir = rootProject.layout.buildDirectory.dir("dokka/$customFormat").get().asFile
        // Wait for dependent editor modules' dokka generation
        dependsOn(dependencyTasks)
        // Wait for engine dokka generation
        dependsOn(tasks.named("dokkaCustomEngine"))
        doFirst {
            dokkaSourceSets.configureEach {
                def engineDependencies = docsLocalDir
                    .listFiles()
                    .findAll { it.name.startsWith("engine") }
                    .collect { it.name }
                (dependencies.collect { it.name } + engineDependencies).each { name ->
                    def uri = new URI("$apiReferenceBasePath/$name")
                    def packageListUri = new File(docsLocalDir, "$name/ly.img[58]$name/package-list").toURI()
                    externalDocumentationLink {
                        url.set(uri.toURL())
                        packageListUrl.set(packageListUri.toURL())
                    }
                }
            }
        }
        if (configureHtmlFiles) {
            doLast {
                configureDokkaFiles(project.layout.buildDirectory.dir("dokka/html").get().asFile)
            }
        }
    }
}

configureDokkaTask("dokkaHtml", "htmlCustom", true)
configureDokkaTask("dokkaGfm", "gfmCustom", false)

def rewriteGfmLinks = { File docsDir, String moduleName ->
    docsDir.eachFileRecurse { file ->
        if (!file.isFile() || !file.name.endsWith(".md")) return

        def sourcePath = docsDir.toPath().relativize(file.toPath())
        def sourceDirectory = sourcePath.parent ?: sourcePath.fileSystem.getPath("")
        def publishedSourceDirectory = sourcePath.fileSystem.getPath(moduleName).resolve(sourceDirectory)
        def markdown = file.getText("UTF-8")
        def rewritten = markdown.replaceAll(/\]\(([^\s)]+)\)/) { match, destination ->
            if (destination ==~ /(?i)([a-z][a-z0-9+.-]*:|\/|#).*/) return match

            def fragmentIndex = destination.indexOf('#')
            def path = fragmentIndex == -1 ? destination : destination.substring(0, fragmentIndex)
            def fragment = fragmentIndex == -1 ? "" : destination.substring(fragmentIndex)
            def absolutePath = publishedSourceDirectory.resolve(path).normalize().toString().replace(File.separator, "/")
            "](${apiReferenceBasePath}/${absolutePath}${fragment})"
        }
        if (rewritten != markdown) {
            file.write(rewritten, "UTF-8")
        }
    }
}

tasks.register("dokkaCustomEngine") {
    def dependency = gradle.includedBuild("engine").task(":dokkaCustom")
    def htmlEngineDocsDir = new File(rootDir, "../../bindings/android/build/dokka/htmlCustom")
    def gfmEngineDocsDir = new File(rootDir, "../../bindings/android/build/dokka/gfmCustom")
    def htmlEditorDocsDir = rootProject.layout.buildDirectory.dir("dokka/htmlCustom").get().asFile
    def gfmEditorDocsDir = rootProject.layout.buildDirectory.dir("dokka/gfmCustom").get().asFile
    dependsOn(dependency)
    doLast {
        htmlEngineDocsDir.listFiles().each {
            configureDokkaFiles(it)
        }
        copy {
            from(htmlEngineDocsDir)
            into(htmlEditorDocsDir)
        }
        copy {
            from(gfmEngineDocsDir)
            into(gfmEditorDocsDir)
        }
        if (useAbsoluteGfmLinks) {
            gfmEngineDocsDir.listFiles().findAll { it.isDirectory() }.each { engineDocsDir ->
                rewriteGfmLinks(new File(gfmEditorDocsDir, engineDocsDir.name), engineDocsDir.name)
            }
        }
    }
}

tasks.register("dokkaHtmlCustom", Copy) {
    group = "documentation"
    dependsOn(tasks.named("dokkaHtml"))
    from(project.layout.buildDirectory.dir("dokka/html"))
    into(rootProject.layout.buildDirectory.dir("dokka/htmlCustom/${project.name}"))
}

tasks.register("dokkaGfmAbsoluteLinks", Copy) {
    group = "documentation"
    dependsOn(tasks.named("dokkaGfm"))
    inputs.property("apiReferenceBasePath", apiReferenceBasePath)
    def sourceDir = project.layout.buildDirectory.dir("dokka/gfm")
    def outputDir = project.layout.buildDirectory.dir("dokka/gfmAbsoluteLinks")
    from(sourceDir)
    into(outputDir)
    doLast {
        rewriteGfmLinks(outputDir.get().asFile, project.name)
    }
}

tasks.register("dokkaGfmCustom", Copy) {
    group = "documentation"
    dependsOn(tasks.named(useAbsoluteGfmLinks ? "dokkaGfmAbsoluteLinks" : "dokkaGfm"))
    from(project.layout.buildDirectory.dir(useAbsoluteGfmLinks ? "dokka/gfmAbsoluteLinks" : "dokka/gfm"))
    into(rootProject.layout.buildDirectory.dir("dokka/gfmCustom/${project.name}"))
}

tasks.register("dokkaCustom") {
    group = "documentation"
    dependsOn(tasks.named("dokkaHtmlCustom"), tasks.named("dokkaGfmCustom"))
}
