apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'maven-publish'
apply plugin: 'com.github.gmazzo.buildconfig'

android {
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()
        aarMetadata {
            // AGP 9 defaults this to compileSdk; declare the consumer requirement separately.
            minCompileSdk = libs.versions.androidMinCompileSdk.get().toInteger()
        }
        if (file("consumer-rules.pro").exists()) {
            consumerProguardFiles "consumer-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose = true
        buildConfig = false
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        // Applied scripts are compiled before the Kotlin Gradle plugin contributes its DSL types;
        // Groovy converts these stable enum names when configuring compilerOptions.
        jvmTarget = "JVM_1_8"
        languageVersion = "KOTLIN_1_9"
        apiVersion = "KOTLIN_1_9"
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                def mavenUrl = "https://maven.img.ly/maven"
                def libGroupId = "ly.img"
                def libArtifactId = project.name
                def libVersion = new File("${project.rootDir}/../..", ".ubq-version").text.trim()

                groupId = libGroupId
                artifactId = libArtifactId
                version = libVersion

                // Artifacts
                from components.release
                versionMapping {
                    allVariants {
                        fromResolutionOf('releaseRuntimeClasspath')
                    }
                }
                artifact(file("$projectDir/../release/LICENSE.md")) {
                    classifier = "LICENSE"
                    extension = "md"
                }
                artifact(file("$projectDir/../release/ThirdPartyLicenses.md")) {
                    classifier = "ThirdPartyLicenses"
                    extension = "md"
                }

                pom {
                    name = "IMGLYEditor"
                    description = "IMGLYEditor is a fully customizable design editor, enabling template-based workflows & automations with just a few lines of code."
                    url = "https://img.ly/"
                    licenses {
                        license {
                            name = "LICENSE"
                            url = "$mavenUrl/${libGroupId.replace('.', "/")}/$artifactId/$libVersion/$artifactId-$libVersion-LICENSE.md"
                        }
                    }
                    developers {
                        developer {
                            id = "imgly"
                            name = "IMG.LY GmbH"
                            email = "contact@img.ly"
                        }
                    }
                }

                repositories {
                    maven {
                        credentials {
                            username = "${System.getenv("UBQ_MAVEN_USERNAME")}"
                            password = "${System.getenv("UBQ_MAVEN_PASSWORD")}"
                        }
                        url = mavenUrl
                    }
                }

                repositories {
                    maven {
                        name = "local"
                        url = "${rootProject.projectDir}/build/artifacts"
                    }
                }
            }
        }
    }
}
